# General
write_to_file: True
exps: [
  # 'avoiding-crazyflie',
  'avoiding-d3il',
  ]
seeds: [9]  #[0, 1, 2, 3, 4]6
avoiding_halfspace_variants: [
  'top-right-hard',    # /
  'top-left-hard',    # \
  'both-hard',    # / and \
  ]   # 'top-right: /', 'top-left: \'
n_trials: 2

dt: {
  'avoiding': 1,    # Since a = [delta_x, delta_y] and not [vx, vy]
  'crazyflie': 1,
}
observation_indices: {
  'avoiding': {'x_des': 0, 'y_des': 1, 'x': 2, 'y': 3},
  'crazyflie':{'x_des': 0, 'y_des': 1, 'x': 2, 'y': 3}
}

action_indices: {
  'avoiding': {'vx': 0, 'vy': 1},
  'crazyflie':{'vx': 0, 'vy': 1, 'vz': 2},
}

# Policy
diffusion_timestep_threshold: 0.5

# Projection 
projection_variants: [
  # Figure 2, Table 1 and Figure 3:
  'dpcc-r',
  'dpcc-r-tightened',
  'dpcc-c',
  'dpcc-c-tightened',
  'dpcc-t',
  'dpcc-t-tightened',
  # Table 1:
  'diffuser',
  'gradient',
  'gradient-tightened',
  'post_processing',
  'post_processing-tightened',
  'model_free',
  'model_free-tightened',
  # Table 2:
  'dpcc-c-tightened-dt0p25',
  'dpcc-c-tightened-dt0p5',
  'dpcc-c-tightened-dt2p0',
  'dpcc-c-tightened-dt4p0',
]
projection_cost: 'pos_vel'
constraint_types: [
  'halfspace', 
  'obstacles', 
  'dynamics',
  'bounds',
  ]
enlarge_constraints: {
  'avoiding': 0.025,
  'crazyflie': 0.025,
}
halfspace_constraints: {
  'avoiding-d3il': [
    # [[0.8, -0.3], [0.3, 0.5], 'below'],   # hard (\ shape)
    # [[0.2, -0.3], [0.7, 0.5], 'below'],     # hard (/ shape)
    [[-0.2, -0.2], [1.1, 0.0], 'above'],   # hard (\ shape) 
    [[-0.2, 0.2], [1.2, 0.0], 'below'],     # hard (/ shape) toprighthard
    [[-0.2, -0.2], [1.1, 0.0], 'above'],   # easier (\ shape)
    [[-0.2, 0.2], [1.2, 0.0], 'below'],   # easier (/ shape)
    ],
    'avoiding-crazyflie': [
    # [[0.8, -0.3], [0.3, 0.5], 'below'],   # hard (\ shape)
    # [[0.2, -0.3], [0.7, 0.5], 'below'],     # hard (/ shape)
    [[-0.2, -0.2], [1.1, 0.0], 'above'],   # hard (\ shape) 
    [[-0.2, 0.2], [1.2, 0.0], 'below'],     # hard (/ shape) toprighthard
    [[-0.2, -0.2], [1.1, 0.0], 'above'],   # easier (\ shape)
    [[-0.2, 0.2], [1.2, 0.0], 'below'],   # easier (/ shape)
    ],
  'avoiding-d3il-v1': [
    # [[0.8, -0.3], [0.3, 0.5], 'below'],   # hard (\ shape)
    # [[0.2, -0.3], [0.7, 0.5], 'below'],     # hard (/ shape)
    [[0.8, -0.5], [0.4, 0.5], 'below'],   # hard (\ shape)
    [[0.2, -0.5], [0.6, 0.5], 'below'],     # hard (/ shape)
    [[0.8, -0.3], [0.575, 0.5], 'below'],   # easier (\ shape)
    [[0.2, -0.3], [0.425, 0.5], 'below'],   # easier (/ shape)
    ],

}
obstacle_constraints: {
  'avoiding-d3il': [
    {'type': 'sphere_outside', 'dimensions': ['x', 'y'], 'center': [0.2, 0.0], 'radius': 0.03},
    {'type': 'sphere_outside', 'dimensions': ['x', 'y'], 'center': [0.4, -0.1], 'radius': 0.03}, 
    {'type': 'sphere_outside', 'dimensions': ['x', 'y'], 'center': [0.4, 0.1], 'radius': 0.03},
    {'type': 'sphere_outside', 'dimensions': ['x', 'y'], 'center': [0.6, -0.2], 'radius': 0.03},
    {'type': 'sphere_outside', 'dimensions': ['x', 'y'], 'center': [0.6, 0.0], 'radius': 0.03},
    {'type': 'sphere_outside', 'dimensions': ['x', 'y'], 'center': [0.6, 0.2], 'radius': 0.03},  
  ],

  'avoiding-crazyflie': [
    {'type': 'sphere_outside', 'dimensions': ['x', 'y'], 'center': [0.2, 0.0], 'radius': 0.03},
    {'type': 'sphere_outside', 'dimensions': ['x', 'y'], 'center': [0.4, -0.1], 'radius': 0.03}, 
    {'type': 'sphere_outside', 'dimensions': ['x', 'y'], 'center': [0.4, 0.1], 'radius': 0.03},
    {'type': 'sphere_outside', 'dimensions': ['x', 'y'], 'center': [0.6, -0.2], 'radius': 0.03},
    {'type': 'sphere_outside', 'dimensions': ['x', 'y'], 'center': [0.6, 0.0], 'radius': 0.03},
    {'type': 'sphere_outside', 'dimensions': ['x', 'y'], 'center': [0.6, 0.2], 'radius': 0.03},  
  ],
  'avoiding-d3il-v1': [
    # {'type': 'sphere_outside', 'dimensions': ['x', 'y'], 'center': [0.575, 0.08], 'radius': 0.1},  # second row, right obstacle larger
    {'type': 'sphere_outside', 'dimensions': ['x', 'y'], 'center': [0.284, 0.144], 'radius': 0.03},  # second row, left obstacle larger
    {'type': 'sphere_outside', 'dimensions': ['x', 'y'], 'center': [0.463, 0.15], 'radius': 0.03},  # second row, right obstacle larger
    {'type': 'sphere_outside', 'dimensions': ['x', 'y'], 'center': [0.615, 0.146], 'radius': 0.03},  # first row obstacle larger
    {'type': 'sphere_outside', 'dimensions': ['x', 'y'], 'center': [0.353, 0.018], 'radius': 0.03},  # second row, left obstacle larger
    {'type': 'sphere_outside', 'dimensions': ['x', 'y'], 'center': [0.553, 0.009], 'radius': 0.03},  # second row, right obstacle larger
    {'type': 'sphere_outside', 'dimensions': ['x', 'y'], 'center': [0.456, -0.114], 'radius': 0.03},  # first row obstacle larger
  ]
}
bounds: {   # need to be within the limits of the dataset due to the normalization
  'avoiding-d3il': [
    {'type': 'lower', 'dimensions': ['vx', 'vy'], 'values': [-0.02, -0.02]},
    {'type': 'upper', 'dimensions': ['vx', 'vy'], 'values': [0.02, 0.02]},
  ],
  
  'avoiding-crazyflie': [
    {'type': 'lower', 'dimensions': ['vx', 'vy'], 'values': [-0.01, 0]},
    {'type': 'upper', 'dimensions': ['vx', 'vy'], 'values': [0.01, 0.01]},
    {'type': 'lower', 'dimensions': ['vx', 'vy'], 'values': [-0.012, 0]},
    {'type': 'upper', 'dimensions': ['vx', 'vy'], 'values': [0.012, 0.012]},
  ],
  #   'avoiding-crazyflie': [
  #   {type: lower, dimensions: [x, y, z], values: [-2.0, -2.0, 0.02]},
  #   {type: upper, dimensions: [x, y, z], values: [2.0,  2.0, 2.0]}
  # ],
  'avoiding-d3il-v1': [
    {'type': 'lower', 'dimensions': ['vx', 'vy'], 'values': [-0.02, -0.02]},
    {'type': 'upper', 'dimensions': ['vx', 'vy'], 'values': [0.02, 0.02]},
  ],
}

# Plotting
plot_how_many: 10
ax_limits: {
  'avoiding-d3il': [[-0.1, 1.1], [-0.3, 0.3]],
  'avoiding-crazyflie': [[-1.0, 1.0], [-0.3, 0.3]],
  'avoiding-d3il-v1': [[0.2, 0.7], [-0.3, 0.3]]
}
