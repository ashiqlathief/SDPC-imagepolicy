<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Scaled Dot-Product Attention</title>
<style>
@page { size: 168mm 162mm; margin: 6mm; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: "Segoe UI", Arial, sans-serif;
  background: #f5f6f8;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 32px 24px 20px;
  color: #1a1a2e;
}
h1 { font-size: 16px; font-weight: 700; letter-spacing: 0.03em; margin-bottom: 4px; }
.subtitle { font-size: 11px; color: #888; margin-bottom: 24px; text-align: center; }

.diagram { display: flex; flex-direction: column; align-items: stretch; width: 100%; max-width: 560px; }

.input-row { display: flex; justify-content: center; }
.chip {
  border-radius: 10px; padding: 10px 16px; text-align: center;
  border: 1.5px solid; font-size: 12px; font-weight: 600;
}
.chip-x { background: #eceff1; border-color: #546e7a; color: #37474f; }

.arrows3 { display: grid; grid-template-columns: 1fr 1fr 1fr; margin: 10px 0 2px; }
.arr-label { text-align: center; font-size: 9.5px; color: #888; font-style: italic; }
.arr { width: 2px; height: 18px; background: #aab; position: relative; margin: 2px auto 0; }
.arr::after {
  content: ""; position: absolute; bottom: -6px; left: 50%; transform: translateX(-50%);
  border-left: 5px solid transparent; border-right: 5px solid transparent; border-top: 7px solid #aab;
}

.qkv-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
.card { border-radius: 10px; padding: 11px 8px; text-align: center; }
.ctitle { font-size: 12px; font-weight: 700; }
.csub { font-size: 8.5px; margin-top: 2px; opacity: 0.85; }
.blue  { background: #e3f2fd; border: 2px solid #1976d2; }
.blue  .ctitle { color: #1565c0; }
.pink  { background: #fce4ec; border: 2px solid #ad1457; }
.pink  .ctitle { color: #ad1457; }
.teal  { background: #e0f2f1; border: 2px solid #00695c; }
.teal  .ctitle { color: #00695c; }

.merge-row { display: flex; align-items: center; justify-content: center; gap: 10px; margin: 14px 0 6px; }
.merge-arrow { font-size: 18px; color: #9ea7b8; }

.wide-card {
  border-radius: 10px; padding: 10px 16px; text-align: center; width: 100%;
}
.orange { background: #fff3e0; border: 2px solid #e65100; }
.orange .ctitle { color: #e65100; }
.purple { background: #ede7f6; border: 2px solid #5e35b1; }
.purple .ctitle { color: #4527a0; }

.stack { display: flex; flex-direction: column; align-items: center; }
.down-arrow { width: 2px; height: 18px; background: #aab; position: relative; margin: 2px 0; }
.down-arrow::after {
  content: ""; position: absolute; bottom: -6px; left: 50%; transform: translateX(-50%);
  border-left: 5px solid transparent; border-right: 5px solid transparent; border-top: 7px solid #aab;
}

.combine-row { display: flex; align-items: center; justify-content: center; gap: 14px; margin: 6px 0; }
.small-chip { border-radius: 8px; padding: 7px 12px; font-size: 11px; font-weight: 700; }

.output {
  margin-top: 8px; background: #e8f5e9; border: 2.5px solid #2e7d32; border-radius: 10px;
  padding: 12px 18px; text-align: center;
}
.output .ctitle { color: #1b5e20; font-size: 13px; }
.output .csub { color: #388e3c; }
</style>
</head>
<body>

<h1>Scaled Dot-Product Attention</h1>
<p class="subtitle">Attention(Q, K, V) = softmax( Q K<sup>T</sup> / &radic;d<sub>k</sub> ) V</p>

<div class="diagram">

  <div class="input-row">
    <div class="chip chip-x">X &isin; &#8477;<sup>n&times;d</sup> &nbsp;(input sequence)</div>
  </div>

  <div class="arrows3">
    <div class="arr-label">W<sub>Q</sub></div>
    <div class="arr-label">W<sub>K</sub></div>
    <div class="arr-label">W<sub>V</sub></div>
  </div>
  <div class="arrows3">
    <div class="arr"></div><div class="arr"></div><div class="arr"></div>
  </div>

  <div class="qkv-row">
    <div class="card blue">
      <div class="ctitle">Q</div>
      <div class="csub">queries</div>
    </div>
    <div class="card pink">
      <div class="ctitle">K</div>
      <div class="csub">keys</div>
    </div>
    <div class="card teal">
      <div class="ctitle">V</div>
      <div class="csub">values</div>
    </div>
  </div>

  <div class="stack">
    <div class="down-arrow"></div>
    <div class="wide-card orange" style="max-width: 320px;">
      <div class="ctitle">Q K<sup>T</sup> / &radic;d<sub>k</sub></div>
      <div class="csub">similarity scores, scaled</div>
    </div>
    <div class="down-arrow"></div>
    <div class="wide-card purple" style="max-width: 320px;">
      <div class="ctitle">softmax( &middot; )</div>
      <div class="csub">attention weights (rows sum to 1)</div>
    </div>
  </div>

  <div class="combine-row">
    <div class="down-arrow"></div>
    <div class="merge-arrow">&times;</div>
    <div class="small-chip teal" style="border:1.5px solid #00695c;">V</div>
  </div>

  <div class="output">
    <div class="ctitle">Output &isin; &#8477;<sup>n&times;d<sub>k</sub></sup></div>
    <div class="csub">each query's weighted average over the values</div>
  </div>

</div>

</body>
</html>
